<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podgląd mobilny</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:-apple-system,"Segoe UI",sans-serif;
         background:linear-gradient(180deg,#F1EFEA,#E6E2DA); position:relative;
         display:flex; gap:72px; justify-content:center; align-items:center; padding:56px 24px; }
  body::before { content:""; position:absolute; inset:0;
         background: radial-gradient(700px 460px at 50% 40%, rgba(76,47,214,.06), transparent 70%); }
  .unit { position:relative; z-index:1; }
  .unit.lift { transform: translateY(-18px); }

  /* rama iPhone'a: prawdziwe proporcje zrzutu z symulatora (720x1368) */
  .phone { position:relative; width:min(252px, 78vw); border-radius:42px;
           background:#111116; padding:9px;
           box-shadow: 0 36px 70px rgba(28,24,40,.30), 0 3px 12px rgba(28,24,40,.16),
                       inset 0 0 0 1.5px rgba(255,255,255,.07); }
  .phone::before { content:""; position:absolute; left:-2px; top:104px; width:3px; height:46px;
           border-radius:2px; background:#2a2a30; }
  .phone::after { content:""; position:absolute; right:-2px; top:128px; width:3px; height:72px;
           border-radius:2px; background:#2a2a30; }
  .phone img { display:block; width:100%; border-radius:33px; }
  .cap { margin-top:22px; text-align:center; font-size:11px; font-weight:600; letter-spacing:.2em;
         text-transform:uppercase; color:#7d7789; }
  .cap b { color:#4C2FD6; font-weight:700; }
  @media (max-width:640px){ body{flex-wrap:wrap; gap:44px;} .unit.lift{transform:none;} }
</style>
</head>
<body>
  <div class="unit lift">
    <div class="phone"><img src="/shots/home.jpg" alt="Menu kategorii na telefonie"></div>
    <p class="cap"><b>innochem.programo.pl</b> · menu kategorii</p>
  </div>
  <div class="unit">
    <div class="phone"><img src="/shots/pdp.jpg" alt="Karta produktu na telefonie"></div>
    <p class="cap">karta produktu · zamówienie</p>
  </div>
</body>
</html>
