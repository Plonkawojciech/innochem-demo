<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podgląd mobilny</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#F1EFE9; font-family:-apple-system,"Segoe UI",sans-serif;
         display:flex; flex-wrap:wrap; gap:48px 56px; justify-content:center; align-items:flex-start;
         padding:32px 24px 48px; min-height:100vh; }
  .unit { position:relative; }
  .phone { width:min(330px, 88vw); aspect-ratio: 390/700; border-radius:32px; background:#101017;
           padding:9px; box-shadow:0 30px 60px rgba(16,16,23,.22), 0 2px 6px rgba(16,16,23,.12); }
  .phone iframe { width:100%; height:100%; border:0; border-radius:24px; background:#F7F6F3; }
  .pill { position:absolute; left:18px; bottom:-16px; display:flex; align-items:center; gap:7px;
          background:#22222d; color:#e8e6ef; font-size:12px; letter-spacing:.02em;
          padding:8px 14px; border-radius:100px; box-shadow:0 10px 24px rgba(16,16,23,.28); }
  .pill svg { width:11px; height:11px; opacity:.75; }
  .cap { text-align:center; margin-top:34px; font-size:13px; color:#6b6675; letter-spacing:.03em; }
</style>
</head>
<body>
  <div class="unit">
    <div class="phone"><iframe src="/" title="Strona główna"></iframe></div>
    <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>innochem.programo.pl</span>
    <p class="cap">Strona główna</p>
  </div>
  <div class="unit">
    <div class="phone"><iframe src="/produkt/hps-5w30" title="Karta produktu"></iframe></div>
    <span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>innochem.programo.pl/produkt</span>
    <p class="cap">Karta produktu</p>
  </div>
</body>
</html>
